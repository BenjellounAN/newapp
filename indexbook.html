<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Benjelloun – Menu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main id="stage" aria-label="Menu du restaurant">
        <div id="book"></div>
    </main>

    <nav id="controls" aria-label="Navigation du menu">
        <button id="prev" aria-label="Page précédente">
            <svg viewBox="0 0 24 24">
                <path d="M15 5l-7 7 7 7" />
            </svg>
        </button>
        <div id="status" aria-live="polite">
            <span id="count">Couverture</span>
            <span id="hint">Touchez la page pour la tourner</span>
        </div>
        <button id="next" aria-label="Page suivante">
            <svg viewBox="0 0 24 24">
                <path d="M9 5l7 7-7 7" />
            </svg>
        </button>
        <button id="snd" aria-pressed="true"></button>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
    <script src="script.js"></script>
</body>

</html>
